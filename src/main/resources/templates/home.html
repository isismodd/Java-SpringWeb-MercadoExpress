<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Express - Home</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <style>
        .hero-section {
            background: url('https://www.bluehost.com/blog/wp-content/uploads/2023/09/eCommerce-statistics.png') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
        }
        .hero-content {
            position: relative;
            z-index: 1;
            color: white;
            padding: 2rem;
            text-align: right;
        }
        .hero-content h1 {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .hero-content p {
            font-size: 1.5rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .btn-hero {
            margin-left: 10px;
            margin-top: 10px;
            border-width: 2px;
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(4px);
        }
        .btn-hero:hover {
            background: rgba(255, 255, 255, 0.3) !important;
        }
        .btn-outline-primary {
            border-color: #0d6efd;
            color: #fff;
        }
        .btn-outline-success {
            border-color: #198754;
            color: #fff;
        }
        .btn-outline-primary:hover {
            background: rgba(13, 110, 253, 0.4) !important;
            color: #fff;
        }
        .btn-outline-success:hover {
            background: rgba(25, 135, 84, 0.4) !important;
            color: #fff;
        }
        .hr-right {
            background: white;
            opacity: 0.5;
            width: 100px;
            margin-left: auto;
            margin-right: 0;
        }
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .hero-content p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="hero-section">
    <div class="container">
        <div class="hero-content">
            <h1>Mercado Express</h1>
            <p>Sistema de gestão de produtos</p>
            <hr class="hr-right">


            <a href="/web/produtos" class="btn btn-outline-primary btn-lg btn-hero">
                <i class="fas fa-box me-2"></i>Ver Produtos
            </a>
            <a href="/web/produtos/novo" class="btn btn-outline-success btn-lg btn-hero">
                <i class="fas fa-plus-circle me-2"></i>Cadastrar Produto
            </a>
        </div>
    </div>
</div>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
