<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5">
    <h1>➕ Cadastrar Produto</h1>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/web/produtos}" th:object="${produto}" method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome *</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <input type="text" id="tipo" th:field="*{tipo}" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="setor" class="form-label">Setor</label>
                    <input type="text" id="setor" th:field="*{setor}" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="tamanho" class="form-label">Tamanho</label>
                    <input type="text" id="tamanho" th:field="*{tamanho}" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label">Preço *</label>
                    <input type="number" step="0.01" id="preco" th:field="*{preco}" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">💾 Salvar</button>
                <a href="/web/produtos" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
