<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::page})}">
<head>
    <title>Lista de Produtos</title>
</head>
<body>
<div th:fragment="page">
    <h1>📋 Produtos</h1>
    <a href="/web/produtos/novo" class="btn btn-success mb-3">➕ Novo Produto</a>

    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Setor</th>
            <th>Preço</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produtos}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.nome}"></td>
            <td th:text="${p.tipo}"></td>
            <td th:text="${p.setor}"></td>
            <td th:text="'R$ ' + ${p.preco}"></td>
            <td>
                <a th:href="@{/web/produtos/{id}(id=${p.id})}" class="btn btn-sm btn-info">👁️</a>
                <a th:href="@{/web/produtos/{id}/editar(id=${p.id})}" class="btn btn-sm btn-warning">✏️</a>
                <form th:action="@{/web/produtos/{id}/delete(id=${p.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Deletar?')">🗑️</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
